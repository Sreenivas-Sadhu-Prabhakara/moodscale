<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #181210; }
  body { display: grid; place-items: center; }
  /* 12% safe padding -> art fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <!-- short graduated band -->
    <rect x="4.5" y="13.5" width="23" height="5" rx="1.4" fill="#EDE6D8" opacity="0.26"/>
    <g stroke="#EDE6D8" stroke-width="1.1" opacity="0.55">
      <line x1="8"  y1="11.5" x2="8"  y2="20.5"/>
      <line x1="12" y1="12.4" x2="12" y2="19.6"/>
      <line x1="16" y1="12.4" x2="16" y2="19.6"/>
      <line x1="20" y1="12.4" x2="20" y2="19.6"/>
      <line x1="24" y1="11.5" x2="24" y2="20.5"/>
    </g>
    <!-- single oxblood marker -->
    <line x1="19" y1="8" x2="19" y2="24" stroke="#C97B85" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="19" cy="16" r="3" fill="#C97B85"/>
  </svg>
</body>
</html>
